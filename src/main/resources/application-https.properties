# Perfil HTTPS local (desarrollo).
# Activar con: ./mvnw spring-boot:run -Dspring-boot.run.profiles=https
# El keystore es local y no se versiona: generarlo con el comando documentado en el README.
server.port=8443
server.ssl.key-store=file:./keystore/biblioteca.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=biblioteca
server.ssl.key-alias=biblioteca
# La cookie de sesion solo viaja por HTTPS.
server.servlet.session.cookie.secure=true

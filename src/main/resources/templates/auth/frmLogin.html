<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión | Gestión de Biblioteca</title>
    <link th:href="@{/styles/bootstrap/bootstrap.min.css}"
          rel="stylesheet"/>
    <link th:href="@{/styles/fontawesome/all.css}"
          rel="stylesheet"/>
    <script th:src="@{/scripts/bootstrap/bootstrap.bundle.js}"
            type="text/javascript"></script>
</head>
<body>
<div class="card">
    <div class="card-header text-bg-dark mb-3">
        Inicio de Sesión
    </div>
    <div class="card-body">
        <div th:if="${param.error}"
             class="alert alert-danger">
            Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}"
             class="alert alert-success">
            La sesión se cerró correctamente.
        </div>
        <form th:action="@{/auth/login}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />
            <div class="mb-3">
                <label for="nomusuario" class="form-label">Usuario</label>
                <input maxlength="15" type="text" class="form-control"
                       name="nomusuario" id="nomusuario">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input maxlength="15" type="password" class="form-control"
                       name="password" id="password">
            </div>
            <button type="submit" id="btningresar" class="btn btn-primary">
                <i class="fas fa-save"></i>
                INGRESAR</button>
            <a class="btn btn-primary" th:href="@{/auth/registrar}"
               role="button">REGISTRARSE</a>
        </form>
    </div>
</div>
</body>
</html>

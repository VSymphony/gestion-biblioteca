spring.application.name=gestion-biblioteca
server.port=8056
spring.datasource.url=jdbc:mysql://localhost:3306/bibliotecadb?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:redhat247}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Sesion: expira a los 15 minutos de inactividad y la cookie no es accesible desde JavaScript.
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
